<style>
.stp-actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px 24px;font-family:Geist,Arial,sans-serif;color:inherit}
.stp-star{--stp-eo:cubic-bezier(.215,.61,.355,1);--stp-eio:cubic-bezier(.645,.045,.355,1);position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 21px;border:1px solid #9b6518;border-radius:9px;background-color:#FFB547;background-image:linear-gradient(178deg,#ffffff30 0%,#ffffff00 42%,#00000009 74%,#ffffff1c 100%);box-shadow:inset 0 1px 0 #ffdb9f,inset 0 -1px 0 #be7d24,0 2px 3px #00000012;color:#000000;font-size:14px;font-weight:600;line-height:1.2;text-decoration:none;white-space:nowrap;overflow:hidden;transition:transform 150ms var(--stp-eo),box-shadow 200ms ease}
.stp-star::before{content:"";position:absolute;z-index:-1;inset:-90% -40%;background:linear-gradient(108deg,transparent 40%,#ffffff60 49%,#ffffff00 59%);transform:translateX(-75%);pointer-events:none}
.stp-star:hover::before,.stp-star:focus-visible::before{animation:stp-sheen 600ms var(--stp-eio) both}
.stp-star:hover{box-shadow:inset 0 1px 0 #ffdb9f,inset 0 -1px 0 #be7d24,0 2px 6px #00000020}
.stp-star:active{transform:translateY(1px) scale(.97);transition-duration:120ms;box-shadow:inset 0 1px 3px #6e4e2930}
.stp-star:focus-visible,.stp-docs:focus-visible{outline:2px solid var(--stp-focus,currentColor);outline-offset:4px}
.stp-star svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.stp-count{font-size:12px;font-variant-numeric:tabular-nums;border-left:1px solid #00000040;padding-left:10px}
.stp-count[hidden]{display:none}
.stp-docs{display:inline-flex;gap:9px;align-items:center;min-height:48px;color:inherit;text-decoration:none;font-size:14px;font-weight:500}
.stp-docs:hover{text-decoration:underline;text-underline-offset:4px}
.stp-docs svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
@keyframes stp-sheen{to{transform:translateX(75%)}}
@media(prefers-reduced-motion:reduce){.stp-star{transition:none}.stp-star:active{transform:none}.stp-star::before{display:none}}
@media(forced-colors:active){.stp-star{border:1px solid ButtonText;color:LinkText;background:Canvas;box-shadow:none}.stp-star::before{display:none}}

@media(prefers-color-scheme:dark){.stp-actions{--stp-focus:#fff}}:root[data-theme="dark"] .stp-actions,[data-surface="dark"] .stp-actions{--stp-focus:#fff}:root[data-theme="light"] .stp-actions,[data-surface="light"] .stp-actions{--stp-focus:#000}
</style>
<div class="stp-actions">
  <a class="stp-star" href="https://github.com/vib-z/stampede" data-star-count="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9Z"/></svg>
    <span>Star on GitHub</span><span class="stp-count" hidden></span>
  </a>
  <a class="stp-docs" href="https://github.com/vib-z/stampede#readme">Read the docs<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h13m-5-5 5 5-5 5"/></svg></a>
</div>

<script>
/* Opt in with data-star-count="true". A plain link is the no-JS fallback. */
(() => {
  const nodes = [...document.querySelectorAll('[data-star-count="true"] .stp-count')];
  if (!nodes.length) return;
  const key = 'stampede:github-stars:v1', ttl = 3600000;
  const valid = n => Number.isSafeInteger(n) && n >= 0;
  const show = n => nodes.forEach(node => {
    node.textContent = new Intl.NumberFormat('en', {notation:'compact', maximumFractionDigits:1}).format(n);
    node.setAttribute('aria-label', `${n.toLocaleString('en')} stars`);
    node.hidden = false;
  });
  const hide = () => nodes.forEach(node => { node.hidden = true; node.textContent = ''; });
  hide();
  try {
    const cached = JSON.parse(localStorage.getItem(key));
    if (cached && valid(cached.count) && Number.isFinite(cached.at) && Date.now() >= cached.at && Date.now() - cached.at < ttl) {
      show(cached.count); return;
    }
  } catch { /* Storage is optional. */ }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3500);
  fetch('https://api.github.com/repos/vib-z/stampede', {
    headers: {Accept:'application/vnd.github+json'}, credentials:'omit', signal:controller.signal
  }).then(response => {
    if (!response.ok) throw new Error('Count unavailable');
    return response.json();
  }).then(data => {
    if (data.full_name !== 'vib-z/stampede' || !valid(data.stargazers_count)) throw new Error('Invalid count');
    show(data.stargazers_count);
    try { localStorage.setItem(key, JSON.stringify({count:data.stargazers_count, at:Date.now()})); } catch { /* Link stays usable. */ }
  }).catch(hide).finally(() => clearTimeout(timer));
})();
</script>
