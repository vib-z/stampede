id = "stampede"
name = "stampede"
version = "0.1.3"
min_herdr_version = "0.9.4"
description = "Text a task to your Grok Bot and it reaches your Mac over Tailscale, where a Claude Code lead does the job in Herdr and adds Codex or Cursor panes only when parallel work helps. Nothing is merged, pushed, sent or spent until you say yes, and it works without a bot too."
platforms = ["macos"]

[[build]]
command = ["bash", "install.sh", "--from-plugin"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "scripts/herdr-plugin-event"]
