name: ci
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: tests
        run: python3 -m unittest discover tests
      - name: install, dry run
        run: ./install.sh --dry-run
      - name: install
        run: mkdir -p ~/.claude && ./install.sh
      - name: Herdr and jq
        run: |
          brew update --quiet   # the runner's cached formulae can be older than the Herdr 0.9.4 the plugin needs
          brew install herdr jq
          herdr --version
      - name: relay sample payloads
        run: bash skills/grokbot-herdr/scripts/test-relay.sh
      - name: start the Herdr server
        run: |
          nohup herdr server > "$RUNNER_TEMP/herdr.log" 2>&1 &
          for _ in $(seq 30); do
            herdr status 2>/dev/null | grep -q 'status: running' && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/herdr.log"
          exit 1
      - name: herdr-doctor, core checks
        run: PATH="$HOME/.local/bin:$PATH" herdr-doctor
      - name: Herdr Core 0.1.20, pinned by checksum
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL https://releases.herdr.dev/core/0.1.20/herdr-core-macos-aarch64.tar.gz -o "$RUNNER_TEMP/hc.tar.gz"
          echo "e58985d3fef6e909f33d3c5a4426e4898c81564a557d4636591cec9e3a06af26  $RUNNER_TEMP/hc.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc"
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hc/hc" --version
      - name: Herdr Core smoke run, in a scratch session
        run: PATH="$HOME/.local/bin:$PATH" python3 tests/core_smoke.py
      - name: evals, the fixture cases (tests/evals)
        run: python3 tests/evals/run.py --label ci-macos --out "$RUNNER_TEMP/evals"
      - name: stop the Herdr server
        if: always()
        run: herdr server stop || true
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      - name: tests
        run: python3 -m unittest discover tests
      - name: relay sample payloads
        run: bash skills/grokbot-herdr/scripts/test-relay.sh
      - name: install, dry run
        run: ./install.sh --dry-run
      - name: install, timers left off
        run: mkdir -p ~/.claude && ./install.sh --no-supervise
      - name: Herdr 0.9.5 and Herdr Core 0.1.20, pinned by checksum
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64 -o "$RUNNER_TEMP/bin/herdr"
          echo "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d  $RUNNER_TEMP/bin/herdr" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/herdr"
          curl -fsSL https://releases.herdr.dev/core/0.1.20/herdr-core-linux-x86_64.tar.gz -o "$RUNNER_TEMP/hc.tar.gz"
          echo "ac6b86890c451a37584620aaa438b71bc0d0bd430a2e7c1d7e095f052c414e74  $RUNNER_TEMP/hc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/bin" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/bin/hc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/herdr" --version && "$RUNNER_TEMP/bin/hc" --version
      - name: start the Herdr server
        run: |
          nohup herdr server > "$RUNNER_TEMP/herdr.log" 2>&1 &
          for _ in $(seq 30); do
            herdr status 2>/dev/null | grep -q 'status: running' && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/herdr.log"
          exit 1
      - name: herdr-doctor, core checks
        run: PATH="$HOME/.local/bin:$PATH" herdr-doctor
      - name: Herdr Core smoke run, in a scratch session
        run: PATH="$HOME/.local/bin:$PATH" python3 tests/core_smoke.py
      - name: evals, the fixture cases (tests/evals)
        run: python3 tests/evals/run.py --label ci-linux --out "$RUNNER_TEMP/evals"
      - name: stop the Herdr server
        if: always()
        run: herdr server stop || true
